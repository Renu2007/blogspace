
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - BlogSpace</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>BlogSpace</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="create-blog.html">Create Blog</a>
            <a href="login.html" id="logout-link">Logout</a>
        </nav>
    </header>

    <main class="blogs">

        <h2 id="dashboard-title">My Dashboard</h2>

        <section>
            <h2>My Profile</h2>
            <p><strong>Name:</strong> <span id="profile-name">Loading...</span></p>
            <p><strong>Email:</strong> <span id="profile-email">Loading...</span></p>
        </section>

        <p>Manage your stories and explore your creativity.</p>

        <a class="btn" href="create-blog.html">
            + Create New Blog
        </a>

        <section>
            <h2>My Blogs</h2>

            <div id="my-blog-list">
                <p>Loading your blogs...</p>
            </div>
        </section>

        <section>
            <h2>Explore All Blogs</h2>

            <div id="blog-list">
                <p>Loading blogs...</p>
            </div>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 BlogSpace. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
